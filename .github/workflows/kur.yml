name: Kur güncelle

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  kur:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: TCMB kurlarını çek
        run: |
          curl -sSfL https://www.tcmb.gov.tr/kurlar/today.xml -o today.xml
          python3 - <<'PY'
          import json, datetime, xml.etree.ElementTree as ET
          root = ET.parse('today.xml').getroot()
          rates = {}
          for c in root.findall('Currency'):
              code = c.get('CurrencyCode')
              if code in ('USD', 'EUR'):
                  val = c.findtext('ForexSelling') or c.findtext('BanknoteSelling')
                  rates[code] = float(val)
          out = {
              "guncelleme": datetime.datetime.utcnow().strftime('%Y-%m-%dT%H:%M:%SZ'),
              "kaynak": "TCMB",
              "usd": rates.get('USD'),
              "eur": rates.get('EUR'),
          }
          json.dump(out, open('rates.json', 'w'), ensure_ascii=False, indent=2)
          print(out)
          PY
      - name: Değişiklik varsa kaydet
        run: |
          git config user.name "kur-botu"
          git config user.email "actions@users.noreply.github.com"
          git add rates.json
          git diff --cached --quiet || (git commit -m "Kur güncelle" && git push)
