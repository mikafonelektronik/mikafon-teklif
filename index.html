body{background:var(--paper);color:var(--ink);font-family:'Poppins','Segoe UI',system-ui,Arial,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.top{background:var(--navy);color:#fff;display:flex;align-items:center;gap:16px;padding:14px 16px;justify-content:space-between;flex-wrap:wrap;position:sticky;top:0;z-index:10}
.top .brand{display:flex;align-items:center;gap:14px}
.top .brand>div{border-left:1px solid rgba(255,255,255,.28);padding-left:14px}
.top img{height:34px;display:block}
.top .title{font-weight:600;font-size:15px}
.top .sub{font-size:12px;opacity:.7}
.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:20px;padding:20px 16px;max-width:1400px;margin:0 auto;align-items:stretch}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;min-width:0}
h2{font-size:15px;margin:0 0 12px;color:var(--navy)}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;min-width:0}
.field label{font-size:12px;color:var(--mute)}
input[type=text],input[type=password],input[type=number],input[type=date],select,textarea{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--cyan);outline-offset:0;border-color:transparent}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2>*{min-width:0}
.field input,.field select{height:42px;width:100%;max-width:100%;min-width:0;display:block}
.field input[type=date]{-webkit-appearance:none;appearance:none;text-align:left;padding:0 11px;font-size:14px;line-height:40px;min-height:42px;display:flex;align-items:center}
#disc{background:#fbe3e1}
.btn{border:0;border-radius:10px;padding:9px 14px;background:var(--blue);color:#fff;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--navy-2)}
.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line)}
.btn.sm{padding:6px 10px;font-size:12px}
.stepper{display:flex;align-items:stretch;height:38px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.stp{width:28px;flex:0 0 28px;border:0;background:#f4f2ed;color:var(--navy);font-size:18px;line-height:1;cursor:pointer;padding:0}
.stepper input.qty{border:0;border-radius:0;height:auto;padding:0 2px;text-align:center;min-width:0;flex:1 1 auto;width:100%}
.btn.del{background:#fff;color:var(--danger);border:1px solid #f2c4bf}
.btn.full{width:100%}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.toolbar input{flex:1 1 180px}
.toolbar select{flex:0 1 220px}
.toolbar input,.toolbar select{height:42px;padding:0 12px;font-size:14px}
.toolbar input{-webkit-appearance:none;appearance:none;border:1px solid var(--line);background:#fff;border-radius:12px;padding:0 16px}
.toolbar select{border-radius:12px;padding:0 16px}
.toolbar input::placeholder{color:var(--mute)}
.col-list{height:0;min-height:100%;display:flex;flex-direction:column}
.plist{display:flex;flex-direction:column;gap:8px;flex:1 1 0;min-height:0;overflow:auto;padding-right:4px}
.prod{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:8px;background:#fff}
.pimg{width:56px;height:56px;border-radius:8px;background:#fff;border:1px solid var(--line);overflow:hidden;display:flex;align-items:center;justify-content:center}
.pimg img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply;display:block}
.prod .nm{font-weight:600;font-size:13px}
.prod .meta{font-size:12px;color:var(--mute)}
.prod .side{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.prod .pr{font-weight:600;color:var(--navy);font-size:13px;white-space:nowrap}
.note{color:var(--mute);font-size:12px;margin-top:6px}
.empty{color:var(--mute);text-align:center;padding:24px 10px;border:1px dashed var(--line);border-radius:12px}
#quote thead th{border-bottom:0;padding-bottom:8px}
#lines td{vertical-align:middle}
#lines td:nth-child(4){font-weight:700;color:var(--navy)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);font-weight:600}
td.num,th.num{text-align:right;white-space:nowrap}
td input.qty{width:64px;text-align:right;padding:6px}
td input.up{width:110px;text-align:right;padding:6px}
.totals{margin-top:12px;margin-left:auto;max-width:340px}
.totals div{display:flex;justify-content:space-between;gap:12px;padding:4px 0}
.totals .grand{font-size:17px;font-weight:700;color:var(--navy);border-top:2px solid var(--navy);margin-top:6px;padding-top:8px}
.gate{position:fixed;inset:0;background:rgba(10,26,47,.7);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.gate .card{max-width:360px;width:100%}
.err{color:var(--danger);font-size:12px;min-height:18px}
.msg{color:var(--danger);font-size:12px;min-height:18px;margin-top:8px}
.saved{color:#0b7a3e;font-size:12px;min-height:18px;margin-top:8px}
.gate{display:none!important}
.sheet{max-width:880px;margin:0 auto 40px;padding:0 16px;box-sizing:border-box;min-width:0}
.pv{background:#fff;border-radius:12px;box-shadow:var(--shadow);padding:28px 28px 22px;color:#0a1a2f}
.pv-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.pv-logo{height:40px;display:block;max-width:100%}
.pv-date{font-size:12px;color:var(--mute)}
.pv-rule{height:4px;margin:14px 0 16px;background:linear-gradient(90deg,#19a8e0 0 55%,#0a1a2f 55% 100%);border-radius:2px}
.pv-rule2{margin:22px 0 12px}
.pv-meta{font-size:12px;display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.pv-wrap{overflow-x:auto}
.pv-table{width:100%;border-collapse:collapse;font-size:12px;min-width:560px}
.pv-table th{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);font-weight:600;border-bottom:1px solid var(--line);padding:6px;text-align:left}
.pv-table td{border-bottom:1px solid var(--line);padding:1px 6px;vertical-align:top!important}
.pv-c{display:flex;align-items:center;min-height:44px}
.pv-tx{flex-direction:column;justify-content:center;align-items:stretch;min-width:0;text-align:left}
.pv-table th.num,.pv-table td.num{text-align:center;white-space:nowrap}
.pv-table th:last-child,.pv-table td:last-child{text-align:right}
.pv-img{width:1%;padding-right:6px;white-space:nowrap}
.pv-img img{flex:0 0 44px;min-width:44px;max-width:44px;box-sizing:border-box;width:44px;height:44px;vertical-align:middle;object-fit:contain;display:block;border:1px solid var(--line);border-radius:8px;background:#fff;padding:2px}
.pv-nm{font-weight:700;font-size:13px;line-height:16px;height:16px}
.pv-br{color:#1d5fae}
.pv-br{font-weight:600;color:#1d5fae;font-size:11px;margin-top:2px}
.pv-ds{color:var(--mute);font-size:10.5px;margin-top:0;line-height:14px;height:14px}
.pv-cat{color:var(--mute);font-size:11px;line-height:14px;height:14px}
.pv-tot{font-weight:700}
.pv-totals{margin:14px 0 0 auto;width:min(460px,100%)}
.pv-row{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:5px 0;font-size:13px}
.pv-row span:last-child{white-space:nowrap;font-weight:600}
.pv-row span:first-child{white-space:nowrap}
.pv-grand{font-size:16px;font-weight:700;border-top:1px solid var(--line);margin-top:4px;padding-top:10px}
.pv-notes{font-size:12px;color:var(--mute);margin-top:12px}
.pv-foot{display:flex;justify-content:space-between;align-items:flex-start;gap:16px 24px;flex-wrap:wrap;font-size:11px;line-height:1.6;color:#5b6a80;border-top:1px solid var(--line);padding-top:12px;width:100%}
.pv-f-col.r{text-align:right;margin-left:auto}
.pv-foot strong{color:#0a1a2f}
.sheet .pv-totals{width:100%;margin:12px 0 0;display:flex;justify-content:space-between;gap:6px;border-top:1px solid var(--line);padding-top:10px}
.sheet .pv-tc{white-space:nowrap}
.sheet .pv-tc:last-child{display:flex;flex-direction:column;align-items:flex-end;text-align:right}
.sheet .pv-tc:last-child span,.sheet .pv-tc:last-child b{text-align:right}
.pv-tc span{display:block;font-size:11px;color:var(--mute)}
.pv-tc b{display:block;font-size:14px}
.pv-tc-g b{font-size:15px}
.pv-terms{margin-top:14px;font-size:12px;line-height:1.7}
.pv-tl{display:flex;justify-content:space-between;gap:18px;white-space:nowrap;font-size:11px;line-height:1.6}
.pv-tl b{font-weight:600}
.pv-terms-h{font-weight:700;text-decoration:underline;font-size:13px;margin-bottom:4px}
.jpegbox{position:fixed;inset:0;background:rgba(10,26,47,.7);display:flex;align-items:flex-start;justify-content:center;padding:16px;overflow:auto;z-index:60}
.jpeg-card{background:#fff;border-radius:12px;padding:16px;max-width:900px;width:100%;color:#0a1a2f}
.jpeg-card p{font-size:13px;margin:0 0 12px}
.jpeg-card img{width:100%;height:auto;display:block;border-radius:8px;margin-bottom:12px}
@media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}.col-list{height:auto;min-height:0}.plist{max-height:none;flex:none;overflow:visible}}
.tabs{display:none}
.cust-card{background:#f7f5ef;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.saved-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.saved-info{min-width:0;font-size:14px}
.saved-btns{display:flex;gap:6px}
.saved-btns .btn{padding:6px 10px;font-size:13px}
.cust-h{font-size:12px;font-weight:600;color:var(--mute);letter-spacing:.04em;text-transform:uppercase;margin:0 0 8px}
.sheet{display:none!important}
@media (max-width:900px){
  .top{position:static;padding:10px 14px}
  .top img{height:26px}
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;gap:8px;margin:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--navy);box-shadow:0 -4px 16px rgba(10,26,47,.18)}
  .tabs button{flex:1;border:1px solid rgba(255,255,255,.25);background:transparent;color:#fff;border-radius:999px;padding:9px 8px;font:inherit;font-weight:500;font-size:13px;cursor:pointer}
  .tabs button.on{background:#fff;color:var(--navy);border-color:#fff}
  .layout{padding:12px 12px 96px;gap:12px}
  .layout[data-view="list"] #quote,.layout[data-view="list"] #sheet,
  .layout[data-view="quote"] .col-list,.layout[data-view="quote"] #sheet,
  .layout[data-view="sheet"] .col-list,.layout[data-view="sheet"] #quote{display:none}
  .sheet{padding:0 0 20px}
  .pv{padding:18px 16px}
  .card{padding:14px}
  .toolbar{flex-direction:column;align-items:stretch}
  .toolbar select{flex:none;width:100%}
  .toolbar input{flex:none;width:100%}
  table:has(#lines) thead{display:none}
  #lines tr{display:grid;grid-template-columns:minmax(0,1fr) 92px minmax(0,1fr) auto;gap:6px 8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
  #lines td{border:0;padding:0;min-width:0}
  #lines td:first-child{grid-column:1/-1}
  #lines td.num{text-align:left}
  #lines td:last-child{grid-column:auto;text-align:right}
  td input.up,td input.qty{width:100%;padding:7px 8px;height:38px}
}



@media (max-width:900px){
  .sheet{max-width:none;padding:0 6px;margin:0 0 24px;overflow:hidden}
  .sheet .pv{width:640px;transform-origin:0 0;padding:24px 26px 20px}
  .sheet .pv-table{min-width:0}
  .sheet .pv-img img{flex:0 0 44px;min-width:44px;max-width:44px;box-sizing:border-box;width:44px;height:44px;padding:2px}
  .sheet .pv-img{width:52px;min-width:52px;padding-right:4px}
  .sheet .pv-table td{padding:0 4px}
  .sheet .pv-nm{white-space:nowrap;overflow:hidden;font-size:11px}
  .sheet .pv-cat{white-space:nowrap;overflow:hidden;font-size:10px}
  .sheet .pv-ds{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:10px;margin-top:1px}
  .sheet .pv-table td:nth-child(2){width:100%;max-width:0}
}
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff}
  .noprint{display:none!important}
  .editable{display:none!important}
  .sheet{display:block!important;margin:0;max-width:none;padding:0}
  .layout,.top{display:none!important}
  #quote{box-shadow:none;padding:0;border-radius:0}
  .top{position:static}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="card">
    <h2>Şirket içi erişim</h2>
    <p class="note" style="margin:0 0 12px">Bu sayfa yalnızca Mikafon çalışanları içindir. Erişim kodunu girin.</p>
    <div class="field"><input type="password" id="code" placeholder="Erişim kodu" autocomplete="current-password"></div>
    <div class="err" id="gerr"></div>
    <button class="btn full" id="gbtn">Giriş</button>
  </div>
</div>

<header class="top noprint">
  <div class="brand">
    <img src="img/logo_white_hd.png" alt="Mikafon">
    <div><div class="title">Teklif Oluşturucu</div><div class="sub">Şirket içi kullanım</div></div>
  </div>
  <nav class="tabs" id="tabs"><button data-v="list" class="on">Ürünler</button><button data-v="quote">Teklif</button></nav>
</header>

<main class="layout" data-view="list">
  <section class="card noprint col-list" aria-label="Ürün listesi">
    <h2>Ürün ekle</h2>
    <div class="toolbar">
      <input type="search" id="q" enterkeyhint="search" autocomplete="off" placeholder="Model, stok kodu veya ürün adı ara">
      <select id="grp" aria-label="Ürün grubu"></select>
      <select id="brand" aria-label="Marka"></select>
    </div>
    <div class="note" id="cnt" style="margin-bottom:8px"></div>
    <div class="plist" id="plist"></div>
  </section>

  <section class="card" id="quote" aria-label="Teklif">
    <div class="editable">
      <div class="cust-card">
        <div class="cust-h">Müşteri bilgileri</div>
        <div class="grid2">
          <div class="field"><label for="cust">Firma / müşteri</label><input type="text" id="cust"></div>
          <div class="field"><label for="contact">Yetkili kişi</label><input type="text" id="contact"></div>
        </div>
      </div>
      <div class="grid2">
        <div class="field"><label for="qno">Teklif no</label><input type="text" id="qno"></div>
        <div class="field"><label for="qdate">Tarih</label><input type="date" id="qdate"></div>
        <div class="field"><label for="valid">Geçerlilik (gün)</label><input type="number" id="valid" min="0" value="15"></div>
        <div class="field"><label for="seller">Hazırlayan</label><input type="text" id="seller"></div>
      </div>
      <div class="grid2">
        <div class="field"><label for="cur">Teklif para birimi</label><select id="cur"><option value="USD">USD ($)</option><option value="EUR">EUR (€)</option><option value="TRY">TL (₺)</option></select></div>
        <div class="field"><label for="disc">İskonto (%)</label><input type="number" id="disc" min="0" max="100" step="0.5" value="0"></div>
        <div class="field"><label for="rateUsd">USD / TL kuru</label><input type="number" id="rateUsd" min="0" step="0.0001" value="49.84" placeholder="örn. 45,20"></div>
        <div class="field"><label for="rateEur">EUR / TL kuru</label><input type="number" id="rateEur" min="0" step="0.0001" value="55.45" placeholder="örn. 52,10"></div>
        
        <div class="field"><label for="vat">KDV (%)</label><input type="number" id="vat" min="0" max="100" step="1" value="20"></div>
      </div>
      <div style="overflow-x:auto">
        <table>
          <thead><tr><th>Ürün</th><th class="num">Birim fiyat</th><th class="num">Adet</th><th class="num">Tutar</th><th class="noprint"></th></tr></thead>
          <tbody id="lines"></tbody>
        </table>
      </div>
      <div id="empty"></div>
      <div class="totals" id="totals"></div>
      <div class="noprint" id="fxnote" style="margin-top:10px;border:1.5px solid #b42318;background:#fdf3f2;border-radius:10px;padding:10px 12px;color:#7a1a12;font-size:13px;line-height:1.6" hidden></div>
      <div class="toolbar noprint" style="margin-top:12px">
        <button class="btn" id="jpeg">PDF kaydet</button>
        <button class="btn ghost" id="save">Teklifi kaydet</button>
        <button class="btn ghost" id="clear">Temizle</button>
      </div>
      <div class="msg" id="msg"></div>
      <div class="saved" id="saved"></div>
      <div class="cust-card" style="margin-top:12px"><div class="cust-h">Kayıtlı teklifler</div><div id="savedList"></div></div>
    </div>
    <div class="jpegbox" id="jpegBox" hidden>
      <div class="jpeg-card">
        <p>PDF hazır. Görüntülemek ve kaydetmek için aşağıdaki bağlantıyı açın.</p>
        <a id="pdfOpen" target="_blank" rel="noopener" style="display:inline-block;margin:0 0 10px;padding:9px 14px;border-radius:10px;background:#1d5fae;color:#fff;text-decoration:none;font-weight:500">PDF'i aç</a>
        <iframe id="pdfFrame" title="Teklif PDF" style="width:100%;height:75vh;border:0;background:#fff;border-radius:8px"></iframe>
        <div style="margin-top:12px;text-align:right"><button class="btn ghost" id="jpegClose">Kapat</button></div>
      </div>
    </div>
  </section>
  <div class="sheet" id="sheet"></div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

const KEY = 'mikafon-teklif-taslak';
const AUTH = 'mikafon-staff-ok';
const SYM = { USD: '$', EUR: '€', TRY: '₺' };
const state = { lines: [] };

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = parseFloat(String(v ?? '').replace(',', '.')); return isFinite(n) ? n : NaN; };
const fmt = (n, cur) => SYM[cur] + Number(n || 0).toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const todayISO = () => new Date().toLocaleDateString('sv-SE');

// Bir birim TL karşılığı: USD, EUR veya TRY için
function tryPer(c) {
  if (c === 'TRY') return 1;
  return c === 'USD' ? num($('rateUsd').value) : num($('rateEur').value);
}
// 1 birim `from` para biriminin, teklif para birimindeki karşılığı (kur eksikse NaN)
function conv1(from) {
  const cur = $('cur').value;
  if (from === cur) return 1;
  const a = tryPer(from), b = tryPer(cur);
  if (!(a > 0) || !(b > 0)) return NaN;
  return a / b;
}

let listLimit = 80;
function resetList() { listLimit = 80; renderList(); }
function renderList() {
  const q = $('q').value.trim().toLocaleLowerCase('tr-TR');
  const g = $('grp').value;
  const bd = $('brand').value;
  // Arama boşluk, tire, nokta gibi işaretleri yok sayar ("class5t" = "CLASS 5T") ve küçük yazım hatalarını tolere eder.
  // Sıra: 0 ürün adında tam eşleşme, 1 diğer alanlarda tam eşleşme, 2-3 aynısı yazım hatalı, 9 eşleşme yok.
  const nq = q.replace(/[^\p{L}\p{N}]+/gu, '');
  const normS = t => String(t).toLocaleLowerCase('tr-TR').replace(/[^\p{L}\p{N}]+/gu, '');
  const fuzzyDist = (qq, t) => { // en az kaç harf değişikliğiyle qq, t içinde bir parça olarak bulunur
    let col = Array.from({ length: qq.length + 1 }, (_, i) => i), best = col[qq.length];
    for (const ch of t) {
      const nc = [0];
      for (let i = 1; i <= qq.length; i++) nc[i] = Math.min(nc[i - 1] + 1, col[i] + 1, col[i - 1] + (qq[i - 1] === ch ? 0 : 1));
      best = Math.min(best, nc[qq.length]); col = nc;
    }
    return best;
  };
  const allow = nq.length <= 4 ? 0 : nq.length <= 7 ? 1 : 2;
  const tier = p => {
    if (!q) return 0;
    if (!nq) return [p.m, p.s, p.c, p.b, p.gt, ...(p.sp || [])].join(' ').toLocaleLowerCase('tr-TR').includes(q) ? 1 : 9;
    const ti = normS([p.m, p.c, p.b].join(' ')), al = normS([p.m, p.s, p.c, p.b, p.gt, ...(p.sp || [])].join(' '));
    if (ti.includes(nq)) return 0;
    if (al.includes(nq)) return 1;
    if (fuzzyDist(nq, ti) <= allow) return 2;
    if (fuzzyDist(nq, al) <= allow) return 3;
    return 9;
  };
  const all = PRODUCTS.map(p => ({ p, t: tier(p) }))
    .filter(x => (!g || x.p.gt === g) && (!bd || x.p.b === bd) && x.t < 9)
    .sort((a, b) => a.t - b.t).map(x => x.p);
  const items = all.slice(0, listLimit);
  $('cnt').textContent = all.length + ' ürün bulundu' + (all.length > listLimit ? ' · ilk ' + listLimit + ' gösteriliyor' : '');
  $('plist').innerHTML = items.map(p => {
    const r = conv1(p.cu);
    let price = 'Fiyat sorunuz';
    if (p.amt != null) price = p.cu === 'EUR' ? fmt(p.amt, 'EUR') : (isNaN(r) ? 'Kur girin' : fmt(p.amt * r, $('cur').value));
    return `
    <div class="prod">
      <div class="pimg">${p.img ? `<img loading="lazy" src="${esc(IMG_BASE + p.img)}" alt="">` : ''}</div>
      <div style="min-width:0">
        <div class="nm">${esc(p.m)} · ${esc(p.c)}</div>
        <div class="meta">S.N: ${esc(p.s)} · ${esc(p.gt)}</div>
      </div>
      <div class="side">
        <div class="pr">${price}</div>
        <button class="btn sm" data-add="${esc(p.s)}">Ekle</button>
      </div>
    </div>`;
  }).join('') || '<div class="empty">Sonuç yok</div>';
  if (all.length > items.length) {
    $('plist').insertAdjacentHTML('beforeend', `<div class="note">${all.length} ürün bulundu, ilk ${items.length} gösteriliyor. <button type="button" class="btn ghost sm" data-more="1">Daha fazla göster</button></div>`);
  }
}

function addLine(s) {
  const p = PRODUCTS.find(x => x.s === s);
  if (!p) return;
  const ex = state.lines.find(l => l.s === s);
  if (ex) ex.qty += 1;
  else state.lines.push({ s: p.s, m: p.m, c: p.c, img: p.img, amt: p.amt, cu: p.cu, qty: 1 });
  persist();
  renderQuote();
}

function renderQuote() {
  const cur = $('cur').value;
  const bad = [...new Set(state.lines.filter(l => l.amt != null && isNaN(conv1(l.cu))).map(l => l.cu))];

      <td><div style="font-weight:600">${esc(l.m)}</div>
          ${l.cu === 'EUR' ? '<div style="color:var(--mute);font-size:12px">Liste fiyatı EUR</div>' : ''}</td>

          value="${unit == null ? '' : unit.toFixed(2)}" placeholder="Fiyat yok" ${isNaN(r) ? 'disabled' : ''}></td>
      <td class="num"><div class="stepper"><button type="button" class="stp" data-step="-1" data-i="${i}" aria-label="Azalt">−</button><input class="qty" type="number" min="1" step="1" data-i="${i}" data-f="qty" value="${l.qty}"><button type="button" class="stp" data-step="1" data-i="${i}" aria-label="Artır">+</button></div></td>
      <td class="num">${unit == null || incomplete ? '—' : fmt(unit * l.qty, cur)}</td>
      <td class="num noprint"><button class="btn del sm" data-rm="${i}">Sil</button></td>
    </tr>`;
  }).join('');
  $('empty').innerHTML = state.lines.length ? '' : '<div class="empty">Soldaki listeden ürün ekleyin.</div>';

  let sub = 0, missing = 0, unconv = 0;
  state.lines.forEach(l => {
    const r = conv1(l.cu);
    if (l.amt == null) missing++;
    else if (isNaN(r)) unconv++;
    else sub += l.amt * r * l.qty;
  });
  const d = Math.min(100, Math.max(0, num($('disc').value) || 0));
  const v = Math.max(0, num($('vat').value) || 0);
  const discAmt = sub * d / 100;

  $('totals').innerHTML = totalsHTML;
  { const eur = state.lines.filter(l => l.cu === 'EUR' && l.amt != null); const fx = $('fxnote');
    if (eur.length) { fx.hidden = false; fx.innerHTML = '<strong>Satış temsilcisi için not</strong><br>' + eur.length + ' ürün euro listesinden alındı.<br>EUR/TL kuru ' + (conv1('EUR') ? Number($('rateEur').value).toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 4 }) : '—') + ' kuruyla ' + $('cur').value + ' karşılığına çevrildi.<br>Bu kur güncel değilse kur alanından güncelleyin.'; }
    else fx.hidden = true; }

  const dateTR = (() => { try { return new Date($('qdate').value + 'T00:00:00').toLocaleDateString('tr-TR', { day: 'numeric', month: 'long', year: 'numeric' }); } catch (x) { return $('qdate').value; } })();
  const unitTxt = n => n.toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 2 }) + ' ' + (cur === 'TRY' ? 'TL' : cur);
  const sMoney = n => (incomplete ? '—' : unitTxt(n));
  const rowsHTML = state.lines.map(l => {
    const r = conv1(l.cu);
    const unit = l.amt != null && !isNaN(r) ? l.amt * r : null;
    const p = PRODUCTS.find(x => x.s === l.s) || {};
    const specs = (p.sp || []).slice(0, 3).join(' · ');
    const img = l.img ? `<img src="${IMG_BASE}${esc(l.img)}" alt="">` : '';
    return `<tr data-s="${esc(l.s)}">
      <td class="pv-img"><div class="pv-c">${img}</div></td>
      <td><div class="pv-c pv-tx"><div class="pv-nm"><span class="pv-br">${esc(p.b || '')}</span> · ${esc(l.m)}</div>
          <div class="pv-cat">${esc(l.c || '')}</div>
          ${(p.sp || []).length ? `<div class="pv-ds">${esc(p.sp[0])}</div>` : ''}</div></td>
      <td class="num" data-l="Adet">${l.qty}</td>
      <td class="num" data-l="Birim">${unit == null ? 'Fiyat sorunuz' : (incomplete ? '—' : unitTxt(unit))}</td>
      <td class="num pv-tot" data-l="Tutar">${unit == null || incomplete ? '—' : unitTxt(unit * l.qty)}</td>
    </tr>`;
  }).join('');
  const sheetTotals = `
    <div class="pv-tc"><span>Ara toplam</span><b>${sMoney(sub)}</b></div>
    <div class="pv-tc"><span>İskonto (%${d})</span><b>− ${sMoney(discAmt)}</b></div>

  const notes = '';
  $('sheet').innerHTML = `

      </div>

function fitSheet() {
  const sh = $('sheet'); const pv = sh && sh.querySelector('.pv'); if (!pv) return;
  if (window.innerWidth > 900) { pv.style.transform = ''; sh.style.height = ''; return; }
  sh.querySelectorAll('.pv-nm').forEach(el => { let fs = 11; el.style.fontSize = fs + 'px'; while (el.scrollWidth > el.clientWidth && fs > 7.5) { fs -= 0.5; el.style.fontSize = fs + 'px'; } });
  const avail = sh.clientWidth - 12; if (avail <= 0) return;
  const s = Math.min(1, avail / 640);

}

const SHEET = { W: 1240, P: 70, PAGE_H: 1754, BOTTOM: 290 };
const NOP = new Proxy({}, { get: () => () => {} });
const fontCss = f => `${f.w} ${f.s}px Poppins, "Segoe UI", Arial, sans-serif`;
const sheetF = (w, s) => ({ w, s });
function hexRgb(h) { const n = parseInt(String(h).slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }

const flat = t => String(t).replace(/\s+/g, ' '); // PDF breaks on newlines; canvas does not, so draw both as one line
function canvasBackend(cv) {
  const ctx = cv.getContext('2d');
  return {
    measure(t, f) { ctx.font = fontCss(f); return ctx.measureText(flat(t)).width; },
    text(t, x, y, f, color, align, base) { ctx.font = fontCss(f); ctx.textAlign = align || 'left'; ctx.textBaseline = base || 'top';
      ctx.fillStyle = color || '#0a1a2f'; ctx.fillText(flat(t), x, y); },
    rect(x, y, w, h, color) { ctx.fillStyle = color; ctx.fillRect(x, y, w, h); },
    strokeRect(x, y, w, h, color, lw) { ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.strokeRect(x, y, w, h); },
    image(im, x, y, w, h) { ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high'; ctx.drawImage(im, x, y, w, h); },
    roundRect(x, y, w, h, r, fill, stroke) {
      ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
      if (fill) { ctx.fillStyle = fill; ctx.fill(); }
      if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 1; ctx.stroke(); }
    }
  };
}

// Vector backend: jsPDF with embedded Poppins TTF. Pixel coordinates from the layout are
// mapped to A4 points; text stays text, shapes stay shapes. Product photos and logo are images.
function pdfBackend(doc) {
  const { W, PAGE_H } = SHEET;
  const k = 595.28 / W, ky = 841.89 / PAGE_H;
  const pg = y => Math.floor(y / PAGE_H);
  const at = y => { const p = pg(y); doc.setPage(p + 1); return (y - p * PAGE_H) * ky; };
  const setF = f => { doc.setFont('Poppins' + f.w, 'normal'); doc.setFontSize(f.s * k); };
  const cache = new Map();
  return {
    measure(t, f) { setF(f); return doc.getTextWidth(flat(t)) / k; },
    text(t, x, y, f, color, align, base) {
      const s = f.s;
      const yb = base === 'middle' ? y + 0.265 * s : base === 'alphabetic' ? y : y + 0.765 * s; // measured Chrome canvas baseline offsets
      const yl = at(yb);
      setF(f); const [r, g, b] = hexRgb(color || '#0a1a2f'); doc.setTextColor(r, g, b);
      const w = doc.getTextWidth(flat(t)) / k;
      const xx = (align === 'center' ? x - w / 2 : align === 'right' ? x - w : x) * k;
      doc.text(flat(t), xx, yl);
    },
    rect(x, y, w, h, color) { const yl = at(y); const [r, g, b] = hexRgb(color); doc.setFillColor(r, g, b); doc.rect(x * k, yl, w * k, h * ky, 'F'); },
    strokeRect(x, y, w, h, color, lw) { const yl = at(y); const [r, g, b] = hexRgb(color); doc.setDrawColor(r, g, b); doc.setLineWidth(lw * k); doc.rect(x * k, yl, w * k, h * ky, 'S'); },
    image(im, x, y, w, h, opt) {
      const png = !!(opt && opt.png);
      let data = cache.get(im);
      if (!data) {
        const c = document.createElement('canvas'); c.width = im.naturalWidth || im.width; c.height = im.naturalHeight || im.height;
        const cx = c.getContext('2d'); cx.fillStyle = '#ffffff'; cx.fillRect(0, 0, c.width, c.height); cx.drawImage(im, 0, 0);
        data = c.toDataURL(png ? 'image/png' : 'image/jpeg', 0.92); cache.set(im, data);
      }
      const yl = at(y); doc.addImage(data, png ? 'PNG' : 'JPEG', x * k, yl, w * k, h * ky);
    },
    roundRect(x, y, w, h, r, fill, stroke) {
      const yl = at(y); let style = 'S';
      if (fill) { const [a, b2, c] = hexRgb(fill); doc.setFillColor(a, b2, c); style = 'F'; }
      if (stroke) { const [a, b2, c] = hexRgb(stroke); doc.setDrawColor(a, b2, c); doc.setLineWidth(1 * k); style = fill ? 'FD' : 'S'; }
      doc.roundedRect(x * k, yl, w * k, h * ky, r * k, r * ky, style);
    }
  };
}

// Single layout used by both the JPEG and the vector PDF. dry=true only measures and returns the page count.
function layoutSheet(B, S, dry, pages) {
  const { W, P, PAGE_H, BOTTOM } = SHEET, IW = W - 2 * P;
  const qtyC = W - P - 400, unitC = W - P - 250, totC = W - P, prodX = P + 84;
  const O = dry ? NOP : B;
  const F = sheetF, M = (t, f) => B.measure(t, f);
  const wrap = (text, maxW, f) => { const out = []; let cur = '';
    for (const w of String(text).split(/\s+/)) { const t = cur ? cur + ' ' + w : w;
      if (M(t, f) > maxW && cur) { out.push(cur); cur = w; } else cur = t; }
    if (cur) out.push(cur); return out; };
  const { rows, imgs, totals, metas, notes, termLines, date, termsH, logo } = S;
  let page = 0, y = P, inTable = false;
  const T = (t, x, yy, f, color, align) => O.text(t, x, yy, f, color || '#0a1a2f', align || 'left', 'top');
  const rule = yy => { O.rect(P, yy, IW * 0.55, 8, '#19a8e0'); O.rect(P + IW * 0.55, yy, IW * 0.45, 8, '#0a1a2f'); };
  const tableHeader = () => {
    T('ÜRÜN', prodX, y, F(700, 16), '#5b6a80');
    T('ADET', qtyC, y, F(700, 16), '#5b6a80', 'center');
    T('BİRİM', unitC, y, F(700, 16), '#5b6a80', 'center');
    T('TUTAR', totC, y, F(700, 16), '#5b6a80', 'right');
    y += 30; O.rect(P, y, IW, 2, '#0a1a2f'); y += 12;
  };
  const need = h => { if (y + h > page * PAGE_H + PAGE_H - BOTTOM) { page++; y = page * PAGE_H + P; if (inTable) tableHeader(); } };

  if (!dry) for (let p = 0; p < pages; p++) O.rect(0, p * PAGE_H, W, PAGE_H, '#ffffff');
  if (logo && !dry) { const lh = 70, lw = logo.width * lh / logo.height; O.image(logo, P, y, lw, lh, { png: true }); }
  T(date, W - P, y + 28, F(400, 22), '#5b6a80', 'right');
  y += 90; rule(y); y += 30;
  metas.forEach(segs => { let x = P; segs.forEach((sg, k) => { let t = sg.t; if (k === 0) t = t.replace(/^ +/, ''); const f = F(sg.b ? 700 : 400, 22); const w = M(t, f); T(t, x, y, f, '#0a1a2f'); x += w; }); y += 36; });
  y += 18;
  need(80); inTable = true; tableHeader();
  if (!rows.length) { T('Henüz ürün eklenmedi.', P, y + 20, F(400, 22), '#5b6a80'); y += 70; }
  const topY = P + 90 + 30 + metas.length * 36 + 18 + 54;
  const rowH = Math.max(60, Math.min(90, Math.floor((PAGE_H - BOTTOM - 252 - topY) / Math.max(1, rows.length))));
  rows.forEach((r, i) => {
    need(rowH);
    const im = imgs[i];
    const bx = Math.min(64, rowH - 10), by = y + (rowH - bx) / 2, ix = bx - 8;
    if (!dry) {
      O.strokeRect(P, by, bx, bx, '#e3dfd5', 1);
      if (im) { const kk = Math.min(ix / im.width, ix / im.height); const w = im.width * kk, hh = im.height * kk;
        O.image(im, P + 4 + (ix - w) / 2, by + 4 + (ix - hh) / 2, w, hh); }
    }
    const maxW = qtyC - 90 - prodX;
    const line1 = r.nm, line2 = r.cat || '', line3 = r.specs[0] || '';
    let sz1 = 24; while (M(line1, F(700, sz1)) > maxW && sz1 > 14) sz1--;
    let sz2 = 18; while (M(line2, F(400, sz2)) > maxW && sz2 > 12) sz2--;
    let sz3 = 18; while (M(line3, F(400, sz3)) > maxW && sz3 > 12) sz3--;
    const cy = y + rowH / 2;
    if (!dry) {
      const brd = r.br || '';
      if (brd && line1.startsWith(brd)) {
        O.text(brd, prodX, cy - 17, F(700, sz1), '#1d5fae', 'left', 'middle');
        const bw = M(brd, F(700, sz1));
        O.text(line1.slice(brd.length), prodX + bw, cy - 17, F(700, sz1), '#0a1a2f', 'left', 'middle');
      } else O.text(line1, prodX, cy - 17, F(700, sz1), '#0a1a2f', 'left', 'middle');
      O.text(line2, prodX, cy + 1, F(400, sz2), '#5b6a80', 'left', 'middle');
      O.text(line3, prodX, cy + 18, F(400, sz3), '#5b6a80', 'left', 'middle');
    }
    T(r.qty, qtyC, cy - 14, F(400, 24), '#0a1a2f', 'center');
    T(r.unit, unitC, cy - 14, F(400, 22), '#0a1a2f', 'center');
    T(r.tot, totC, cy - 14, F(700, 24), '#0a1a2f', 'right');
    y += rowH;
    if (!dry) O.rect(P, y, IW, 1, '#e3dfd5');
  });
  inTable = false;
  y += 30;
  need(120);
  if (totals.length) {
    const meas = totals.map(t => Math.max(M(t.l, F(400, 17)), M(t.r, F(700, t.grand ? 26 : 22))));
    const sumW = meas.reduce((a, b) => a + b, 0), gap = totals.length > 1 ? (IW - sumW) / (totals.length - 1) : 0;
    let x = P;
    totals.forEach((t, i) => { const last = i === totals.length - 1; const al = last ? 'right' : 'left'; const xx = last ? W - P : x;
      T(t.l, xx, y, F(400, 17), '#5b6a80', al); T(t.r, xx, y + 24, F(700, t.grand ? 26 : 22), '#0a1a2f', al); x += meas[i] + gap; });
    y += 72;
  }
  notes.forEach(n => { const f = F(400, 20); const lines = wrap(n, IW, f); need(lines.length * 28 + 12);
    lines.forEach(line => { T(line, P, y, f, '#5b6a80'); y += 28; }); y += 12; });
  if (termLines.length) {
    need(150); y += 6; T(termsH, P, y, F(700, 20)); y += 36;
    termLines.forEach(segs => { segs.forEach((t, i) => { const x = P + i * (IW / 2); const lw = M(t.l, F(700, 17));
      T(t.l, x, y, F(700, 17), '#0a1a2f'); T(t.r, x + lw, y, F(400, 17), '#5b6a80'); }); y += 30; });
    y += 36;
  }
  if (dry) return page + 1;
  for (let p = 0; p < pages; p++) {
    const yb = p * PAGE_H + PAGE_H - 50, fy = p * PAGE_H + PAGE_H - 232;
    O.rect(P, fy, IW * 0.55, 4, '#19a8e0'); O.rect(P + IW * 0.55, fy, IW * 0.45, 4, '#0a1a2f');
    O.text('MİKAFON ELEKTRONİK İNŞ. SAN. LTD. ŞTİ.', P, fy + 46, F(700, 18), '#0a1a2f', 'left', 'alphabetic');
    const fl = 'FABRİKA: ';
    O.text(fl, P, fy + 74, F(700, 17), '#0a1a2f', 'left', 'alphabetic');
    O.text('Cumhuriyet Mah. Keten Sok. No.8 Kocaeli / Türkiye', P + M(fl, F(700, 17)), fy + 74, F(400, 17), '#5b6a80', 'left', 'alphabetic');
    const sl = 'SHOWROOM: ';
    O.text(sl, P, fy + 102, F(700, 17), '#0a1a2f', 'left', 'alphabetic');
    O.text('Bereketzade Mah. Şair Ziya Paşa Cad. No.8 Beyoğlu / İstanbul', P + M(sl, F(700, 17)), fy + 102, F(400, 17), '#5b6a80', 'left', 'alphabetic');
    ['Tel: +90 212 244 5177', 'info@mikafon.com.tr', 'www.mikafon.com.tr'].forEach((l, i) =>
      O.text(l, W - P, fy + 46 + i * 28, F(400, 17), '#5b6a80', 'right', 'alphabetic'));
    O.rect(P, yb - 28, IW, 1, '#e3dfd5');
    const ft = 'Sayfa ' + (p + 1) + ' / ' + pages;
    const bw = M(ft, F(600, 15)) + 44, bh = 42, bx2 = W - P - bw, by2 = yb - 16, r = 21;
    O.roundRect(bx2, by2, bw, bh, r, '#ffffff', '#e3dfd5');
    O.text(ft, bx2 + bw / 2, by2 + bh / 2 + 1, F(600, 15), '#5b6a80', 'center', 'middle');
  }
  return pages;
}

// Reads the live preview into plain data. Images are loaded before layout.
async function collectSheet() {
  const pv = document.querySelector('#sheet .pv');
  if (!pv) throw new Error('önizleme yok');
  try { await document.fonts.ready; } catch (x) {}
  const T1 = sel => ((pv.querySelector(sel) || {}).textContent || '').trim();
  const rows = [...pv.querySelectorAll('.pv-table tbody tr')].filter(tr => tr.querySelector('.pv-nm')).map(tr => {
    const td = tr.querySelectorAll('td'); const img = tr.querySelector('img');
    const prod = PRODUCTS.find(x => x.s === tr.dataset.s) || {};
    return { src: img ? img.getAttribute('src') : null, nm: (tr.querySelector('.pv-nm').textContent || '').trim(),
      br: prod.b || '', cat: (tr.querySelector('.pv-cat') || {}).textContent || '', specs: (prod.sp || []).slice(0, 1),
      qty: td[2].textContent, unit: td[3].textContent, tot: td[4].textContent };
  });
  const totals = [...pv.querySelectorAll('.pv-tc')].map(c => ({ l: c.querySelector('span').textContent, r: c.querySelector('b').textContent, grand: c.classList.contains('pv-tc-g') }));
  const metas = [...pv.querySelectorAll('.pv-meta > div')].map(d => [...d.childNodes].map(n => ({ t: n.textContent.replace(/\s+/g, ' '), b: n.nodeName === 'STRONG' })).filter(sg => sg.t !== ''));
  const notes = [...pv.querySelectorAll('.pv-notes')].map(n => n.textContent.trim());
  const termLines = [...pv.querySelectorAll('.pv-tl')].map(ln => [...ln.querySelectorAll('span')].map(sp => { const b = sp.querySelector('b').textContent; return { l: b, r: sp.textContent.slice(b.length) }; }));
  const load = src => new Promise(res => { if (!src) return res(null); const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = src; });
  const logo = await load('img/logo_blue.png');
  const imgs = await Promise.all(rows.map(r => load(r.src)));
  return { rows, imgs, totals, metas, notes, termLines, date: T1('.pv-date'), termsH: pv.querySelector('.pv-terms-h').textContent, logo };
}

async function buildJpeg() {
  const S = await collectSheet();
  const cv = document.createElement('canvas'); const B0 = canvasBackend(cv);
  const pages = layoutSheet(B0, S, true);
  cv.width = SHEET.W; cv.height = pages * SHEET.PAGE_H;
  layoutSheet(B0, S, false, pages);
  const out = [];
  for (let p = 0; p < pages; p++) {
    const pc = document.createElement('canvas'); pc.width = SHEET.W; pc.height = SHEET.PAGE_H;
    pc.getContext('2d').drawImage(cv, 0, p * SHEET.PAGE_H, SHEET.W, SHEET.PAGE_H, 0, 0, SHEET.W, SHEET.PAGE_H);
    out.push(pc.toDataURL('image/jpeg', 0.95));
  }
  return out;
}

async function buildVectorPdf() {
  if (!window.jspdf || !window.jspdf.jsPDF) throw new Error('PDF kütüphanesi yüklenemedi');
  const S = await collectSheet();
  const doc = new window.jspdf.jsPDF({ unit: 'pt', format: [595.28, 841.89], orientation: 'portrait', compress: true });
  [400, 500, 600, 700].forEach(w => { doc.addFileToVFS('Poppins' + w + '.ttf', PDF_FONTS[w]); doc.addFont('Poppins' + w + '.ttf', 'Poppins' + w, 'normal'); });
  const B = pdfBackend(doc);
  const pages = layoutSheet(B, S, true);
  for (let p = 1; p < pages; p++) doc.addPage([595.28, 841.89], 'portrait');
  layoutSheet(B, S, false, pages);
  return doc.output('blob');
}

function makePdf(jpegs, w, h) {
  const enc = new TextEncoder(); const parts = []; let len = 0; const offs = [];
  const push = d => { const b = typeof d === 'string' ? enc.encode(d) : d; parts.push(b); len += b.length; };
  const n = jpegs.length, N = 3 * n + 2, pw = 595.28, ph = 841.89;
  push('%PDF-1.4\n');
  offs[1] = len; push('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
  const kids = jpegs.map((_, i) => (3 + 3 * i) + ' 0 R').join(' ');
  offs[2] = len; push('2 0 obj\n<< /Type /Pages /Kids [' + kids + '] /Count ' + n + ' >>\nendobj\n');
  jpegs.forEach((url, i) => {
    const pn = 3 + 3 * i, cn = pn + 1, inn = pn + 2;
    const bin = atob(url.split(',')[1]); const bytes = new Uint8Array(bin.length);
    for (let k = 0; k < bin.length; k++) bytes[k] = bin.charCodeAt(k);
    const content = 'q ' + pw + ' 0 0 ' + ph + ' 0 0 cm /Im' + i + ' Do Q';
    offs[pn] = len; push(pn + ' 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ' + pw + ' ' + ph + '] /Resources << /XObject << /Im' + i + ' ' + inn + ' 0 R >> >> /Contents ' + cn + ' 0 R >>\nendobj\n');
    offs[cn] = len; push(cn + ' 0 obj\n<< /Length ' + content.length + ' >>\nstream\n' + content + '\nendstream\nendobj\n');
    offs[inn] = len; push(inn + ' 0 obj\n<< /Type /XObject /Subtype /Image /Width ' + w + ' /Height ' + h + ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' + bytes.length + ' >>\nstream\n'); push(bytes); push('\nendstream\nendobj\n');
  });
  const xref = len; let x = 'xref\n0 ' + (N + 1) + '\n0000000000 65535 f \n';
  for (let k = 1; k <= N; k++) x += String(offs[k]).padStart(10, '0') + ' 00000 n \n';
  push(x); push('trailer\n<< /Size ' + (N + 1) + ' /Root 1 0 R >>\nstartxref\n' + xref + '\n%%EOF\n');
  return new Blob(parts, { type: 'application/pdf' });
}
$('jpeg').addEventListener('click', async () => {
  const btn = $('jpeg'); const old = btn.textContent;
  btn.disabled = true; btn.textContent = 'Hazırlanıyor…';
  try {
    let blob;
    try { blob = await buildVectorPdf(); }
    catch (ve) { blob = makePdf(await buildJpeg(), 1240, 1754); }
    const url = URL.createObjectURL(blob);
    $('pdfFrame').src = url; $('pdfOpen').href = url;
    $('jpegBox').hidden = false;
  } catch (e) {
    $('msg').textContent = 'JPEG oluşturulamadı: ' + (e && e.message ? e.message : 'bilinmeyen hata');
  } finally { btn.disabled = false; btn.textContent = old; }
});
$('jpegClose').addEventListener('click', () => { $('jpegBox').hidden = true; });
$('save').addEventListener('click', () => { const ok = persist() && saveQuote(); renderSaved(); $('saved').textContent = ok ? 'Taslak bu tarayıcıda kaydedildi.' : 'Taslak kaydedilemedi: tarayıcı depolaması kapalı olabilir.'; setTimeout(() => $('saved').textContent = '', 3000); });
const LIST_KEY = 'mikafon_teklifler_v1';
function readList() { try { return JSON.parse(localStorage.getItem(LIST_KEY) || '[]'); } catch (e) { return []; } }
function writeList(a) { try { localStorage.setItem(LIST_KEY, JSON.stringify(a)); return true; } catch (e) { return false; } }
function saveQuote() {
  const o = { lines: state.lines }; FIELDS.forEach(k => { o[k] = $(k).value; });
  const list = readList(); const item = { qno: o.qno, cust: o.cust, savedAt: new Date().toISOString(), data: o };
  const i = list.findIndex(x => x.qno === o.qno);
  if (i >= 0) list[i] = item; else list.unshift(item);
  return writeList(list);
}
function renderSaved() {
  const box = $('savedList'); const list = readList();
  if (!list.length) { box.innerHTML = '<div class="empty">Henüz kayıtlı teklif yok.</div>'; return; }
  box.innerHTML = list.map((x, i) => '<div class="saved-row"><div class="saved-info"><b>' + esc(x.qno || '-') + '</b> · ' + esc(x.cust || 'Müşteri adı yok') + '<div class="mute">' + esc((x.data && x.data.qdate) || '') + '</div></div><div class="saved-btns"><button class="btn ghost" data-open="' + i + '">Aç</button><button class="btn ghost" data-copy="' + i + '">Kopya</button><button class="btn ghost" data-del="' + i + '">Sil</button></div></div>').join('');
}
$('savedList').addEventListener('click', e => {
  const o = e.target.closest('[data-open]'), d = e.target.closest('[data-del]');
  const c = e.target.closest('[data-copy]');
  if (c) {
    const x = readList()[+c.dataset.copy]; if (!x) return;
    const data = Object.assign({}, x.data, { qno: newQuoteNo(), qdate: todayISO() });
    try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (err) {}
    restore(); renderList(); renderQuote(); persist();
    $('saved').textContent = 'Kopya açıldı, yeni teklif no: ' + data.qno; setTimeout(() => $('saved').textContent = '', 3000);
    return;
  }
  if (o) {
    const x = readList()[+o.dataset.open]; if (!x) return;
    try { localStorage.setItem(KEY, JSON.stringify(x.data)); } catch (err) {}
    restore(); renderList(); renderQuote();
    $('saved').textContent = 'Teklif açıldı: ' + x.qno; setTimeout(() => $('saved').textContent = '', 3000);
    return;
  }
  if (d) {
    if (!d.dataset.armed) { d.dataset.armed = '1'; d.textContent = 'Emin misiniz?'; setTimeout(() => { delete d.dataset.armed; d.textContent = 'Sil'; }, 4000); return; }
    const list = readList(); list.splice(+d.dataset.del, 1); writeList(list); renderSaved();
  }
});
fetch('rates.json', { cache: 'no-store' }).then(r => (r.ok ? r.json() : null)).then(d => {
  if (!d) return;
  if (typeof d.usd === 'number') $('rateUsd').value = d.usd;
  if (typeof d.eur === 'number') $('rateEur').value = d.eur;
  persist(); renderList(); renderQuote();
}).catch(() => {});
renderSaved();
let clearArmed = false;
$('clear').addEventListener('click', () => {
  if (!clearArmed) { clearArmed = true; $('clear').textContent = 'Emin misiniz? Tekrar tıklayın'; setTimeout(() => { clearArmed = false; $('clear').textContent = 'Temizle'; }, 4000); return; }
  clearArmed = false; $('clear').textContent = 'Temizle';
  state.lines = [];
  ['cust','contact'].forEach(k => $(k).value = '');
  $('disc').value = '0'; $('vat').value = '20'; $('valid').value = '15';
  $('qno').value = newQuoteNo(); $('qdate').value = todayISO();
  persist(); renderList(); renderQuote();
});

(function(){
  const setView = v => { document.querySelector('.layout').dataset.view = v;
    document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
    if (v === 'sheet') fitSheet();
    window.scrollTo(0, 0); };
  document.querySelectorAll('#tabs button').forEach(b => b.addEventListener('click', () => setView(b.dataset.v)));
  setView('list');
})();

document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.tagName === 'INPUT') { e.preventDefault(); e.target.blur(); } });
